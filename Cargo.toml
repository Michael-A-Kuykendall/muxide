[package]
name = "muxide"
version = "0.2.6"
edition = "2021"
rust-version = "1.81"
description = "Minimal-dependency pure-Rust MP4 muxer for recording applications. Includes CLI tool and library API."
authors = ["Michael A. Kuykendall <michaelallenkuykendall@gmail.com>"]
readme = "README.md"
repository = "https://github.com/Michael-A-Kuykendall/muxide"
homepage = "https://github.com/Michael-A-Kuykendall/muxide"
documentation = "https://docs.rs/muxide"
license = "MIT OR Apache-2.0"
keywords = ["mp4", "video", "muxer", "h264", "hevc"]
categories = ["multimedia", "multimedia::encoding", "multimedia::video", "command-line-utilities"]
exclude = [
	".github/",
	".vscode/",
	"release-notes/",
	"target/",
	"**/*.mp4",
	"**/*.gif",
	"**/*.rgb",
	"**/*.h264",
	"**/*.bak",
]

[[bin]]
name = "muxide"
path = "src/bin/muxide.rs"
required-features = ["cli"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive", "color", "suggestions"], optional = true }
indicatif = { version = "0.17", optional = true }
anyhow = "1.0"
thiserror = "1.0"
wasm-bindgen = { version = "0.2", optional = true }

[features]
default = ["cli"]
cli = ["dep:clap", "dep:indicatif"]
wasm = ["wasm-bindgen"]

# proptest/criterion/lazy_static/tempfile do not build for wasm32, so only pull
# them for non-wasm targets. This keeps `cargo test --target wasm32-...` working.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
lazy_static = "1.4"
proptest = "=1.5.0"
tempfile = "3.0"
criterion = "0.5"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[[bench]]
name = "muxing"
harness = false

[workspace]
